<title>100 Basic English Conversation Quiz</title>
<style>

    --correct-text:#8FE3B4; --wrong-text:#F2A48F; --score-none:#8A9391;
  }
}
:root[data-theme="dark"]{
  --bg:#1B2020; --card:#242B2B; --ink:#E7EEED; --sub:#A7B3B1;
  --accent:#7FBFC2; --accent-dark:#5FA0A3; --terracotta:#E3B274;
  --good:#6FC79A; --good-bg:#1E3A2C; --bad:#E9836B; --bad-bg:#472621;
  --chip:#303938; --chip-border:#414D4B; --shadow:0 4px 14px rgba(0,0,0,0.28);
  --sel-bg:#33474A; --input-bg:#242B2B; --heading:#9BD3D4; --overall-grad:linear-gradient(135deg,#26312D,#1F3235);
  --correct-text:#8FE3B4; --wrong-text:#F2A48F; --score-none:#8A9391;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Poppins","Segoe UI","Leelawadee UI",sans-serif;line-height:1.6;}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 80px;}
header.top{position:sticky;top:0;background:linear-gradient(180deg,var(--bg) 85%,transparent);padding:10px 0 6px;z-index:10;}
h1{font-size:1.4rem;margin:.2em 0;color:var(--heading);}
h2{font-size:1.15rem;color:var(--heading);margin-top:1.6em;}
.badge{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;padding:2px 12px;font-size:.8rem;margin-left:8px;}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:18px 20px;margin:14px 0;}
.part-title{display:flex;align-items:center;gap:10px;margin-top:28px;}
.part-title .num{background:var(--terracotta);color:#fff;font-weight:bold;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.grouplist{display:grid;gap:10px;}
.grow{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow);cursor:pointer;border:2px solid transparent;transition:.15s;}
.grow:hover{border-color:var(--accent);transform:translateY(-1px);}
.grow .info{flex:1;}
.grow .gt{font-weight:600;}
.grow .gs{font-size:.85rem;color:var(--sub);}
.grow .score{font-weight:700;color:var(--accent-dark);min-width:64px;text-align:right;}
.grow .score.none{color:var(--score-none);font-weight:400;}
.btn{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:10px 20px;font-size:1rem;cursor:pointer;font-family:inherit;transition:.15s;}
.btn:hover{background:var(--accent-dark);}
.btn.secondary{background:var(--chip);color:var(--ink);}
.btn.secondary:hover{background:var(--chip-border);}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
.progressbar{background:var(--chip);border-radius:999px;height:10px;overflow:hidden;margin:10px 0 18px;}
.progressbar > div{background:var(--accent);height:100%;transition:width .25s;}
.qnum{font-size:.85rem;color:var(--sub);margin-bottom:4px;}
.qtext{font-size:1.12rem;margin-bottom:14px;font-weight:500;}
.choices{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:6px;}
.chip{background:var(--chip);border:2px solid var(--chip-border);border-radius:12px;padding:10px 16px;cursor:pointer;font-size:1rem;font-family:inherit;transition:.12s;color:var(--ink);}
.chip:hover{border-color:var(--accent);}
.chip.sel{border-color:var(--accent-dark);}
.chip.correct{background:var(--good-bg);border-color:var(--good);color:var(--correct-text);font-weight:600;}
.chip.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--wrong-text);}
.chip.disabled{cursor:default;}
.chip.faded{opacity:.45;}
.inline-blank{display:inline-flex;flex-wrap:wrap;gap:6px;vertical-align:middle;margin:0 4px;}
.chip-inline{margin:2px 4px;vertical-align:middle;}
.sentence{font-size:1.12rem;line-height:2.2;}
select.blanksel{font-family:inherit;font-size:1rem;padding:6px 10px;border-radius:10px;border:2px solid var(--chip-border);background:var(--input-bg);color:var(--ink);}
select.blanksel.correct{border-color:var(--good);background:var(--good-bg);}
select.blanksel.wrong{border-color:var(--bad);background:var(--bad-bg);}
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
.matchcol{display:flex;flex-direction:column;gap:8px;}
.matchitem{background:var(--chip);border:2px solid var(--chip-border);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:.98rem;text-align:left;}
.matchitem.sel{border-color:var(--accent-dark);background:var(--sel-bg);}
.matchitem.correct{background:var(--good-bg);border-color:var(--good);cursor:default;}
.matchitem.wrong-flash{background:var(--bad-bg);border-color:var(--bad);}
.orderrow{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0;}
.slot{min-width:110px;min-height:44px;border:2px dashed var(--chip-border);border-radius:12px;display:flex;align-items:center;justify-content:center;padding:6px 10px;font-size:.95rem;background:var(--bg);cursor:pointer;}
.slot.filled{border-style:solid;background:var(--chip);cursor:pointer;}
.slot.correct{border-color:var(--good);background:var(--good-bg);border-style:solid;}
.slot.wrong{border-color:var(--bad);background:var(--bad-bg);border-style:solid;}
.pool{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0;}
.sortbox{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px;}
.sortcat{border:2px dashed var(--chip-border);border-radius:14px;padding:10px;min-height:120px;}
.sortcat h4{margin:0 0 8px;color:var(--accent-dark);text-align:center;}
.sortcat .item{background:var(--good-bg);border:2px solid var(--good);border-radius:10px;padding:6px 10px;margin:4px;display:inline-block;font-size:.9rem;}
.table-wrap{overflow-x:auto;}
table.qtable{border-collapse:collapse;width:100%;margin:10px 0;}
table.qtable th,table.qtable td{border:1px solid var(--chip-border);padding:8px;text-align:center;font-size:.92rem;}
table.qtable th{background:var(--chip);}
.summary{text-align:center;padding:30px 10px;}
.summary .big{font-size:2.6rem;font-weight:800;color:var(--accent-dark);}
.instrbox{background:var(--chip);border-radius:12px;padding:10px 14px;font-size:.92rem;color:var(--sub);margin-bottom:16px;}
.homehead{text-align:center;margin-bottom:10px;}
.homehead p{color:var(--sub);}
.overall{background:var(--overall-grad);border-radius:18px;padding:18px 20px;text-align:center;margin-bottom:20px;box-shadow:var(--shadow);}
.overall .big{font-size:2.2rem;font-weight:800;color:var(--heading);}
a.backlink{color:var(--accent-dark);text-decoration:none;font-weight:600;cursor:pointer;}
.reveal{margin-top:10px;color:var(--sub);font-size:.92rem;}
@media(max-width:560px){.matchgrid{grid-template-columns:1fr;}.sortbox{grid-template-columns:1fr;}}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function getLastScore(){try{return JSON.parse(localStorage.getItem('convquiz_last')||'null');}catch(e){return null;}}
function saveLastScore(score,total){localStorage.setItem('convquiz_last',JSON.stringify({score:score,total:total,date:new Date().toLocaleDateString()}));}

const app = document.getElementById('app');
let ST = null;

function totalCount(){ let t=0; PARTS.forEach(p=>t+=p.groups[0].items.length); return t; }

function render(){
  ST = {score:0, doneCount:0, total: totalCount()};
  let html = '';
  html += '<header class="top"><h1>💬 100 Basic English Conversation Quiz</h1></header>';
  html += '<div class="homehead"><p>Answer each question below — every answer is checked right away. Scroll through all 100 questions at your own pace.</p></div>';
  html += '<div class="overall"><div>Progress</div><div class="big" id="progressBig">0 / '+ST.total+'</div>';
  const last = getLastScore();
  if(last){ html += '<div style="margin-top:6px">Last attempt: '+last.score+' / '+last.total+' ('+last.date+')</div>'; }
  html += '</div>';
  html += '<div style="text-align:center;margin-bottom:10px"><button class="btn secondary" id="resetBtn">🔄 Reset &amp; Shuffle Again</button></div>';

  let idxCounter = 0;
  PARTS.forEach((part,pi)=>{
    html += '<div class="part-title"><div class="num">'+(pi+1)+'</div><h2 style="margin:0">'+part.title+'</h2></div>';
    part.groups[0].items.forEach(item=>{
      const idx = idxCounter++;
      html += '<div class="card">'+renderMcHTML(item, idx)+'</div>';
    });
  });
  html += '<div id="finishWrap" style="margin:24px 0;"></div>';
  app.innerHTML = html;

  idxCounter = 0;
  PARTS.forEach(part=>{
    part.groups[0].items.forEach(item=>{
      const idx = idxCounter++;
      wireMc(item, idx);
    });
  });
  document.getElementById('resetBtn').addEventListener('click', render);
  window.scrollTo(0,0);
}

function updateProgress(){
  document.getElementById('progressBig').textContent = ST.doneCount+' / '+ST.total;
}
function checkAllDone(){
  ST.doneCount++;
  updateProgress();
  if(ST.doneCount>=ST.total){
    saveLastScore(ST.score, ST.total);
    const pct = Math.round(ST.score/ST.total*100);
    document.getElementById('finishWrap').innerHTML =
      '<div class="card summary"><div>All done! 🎉</div><div class="big">'+ST.score+' / '+ST.total+'</div>'+
      '<div style="color:var(--sub)">('+pct+'%)</div></div>';
    window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'});
  }
}

function renderMcHTML(item, idx){
  const choices = shuffle(item.c.slice());
  const answerVal = item.c[item.a];
  let html = '<div class="qtext">'+item.s+'</div>';
  html += '<div class="choices" id="choicesRow_'+idx+'"></div>';
  html += '<div style="display:none" id="choicesData_'+idx+'">'+JSON.stringify(choices)+'</div>';
  html += '<div style="display:none" id="answerData_'+idx+'">'+answerVal.replace(/"/g,'&quot;')+'</div>';
  return html;
}
function wireMc(item, idx){
  const choices = JSON.parse(document.getElementById('choicesData_'+idx).textContent);
  const answerVal = document.getElementById('answerData_'+idx).textContent;
  const row = document.getElementById('choicesRow_'+idx);
  const btns = [];
  choices.forEach(ch=>{
    const b = document.createElement('button');
    b.className='chip'; b.type='button'; b.textContent=ch;
    b.addEventListener('click', ()=>{
      btns.forEach(x=>x.classList.add('disabled'));
      const correct = ch===answerVal;
      b.classList.add(correct?'correct':'wrong');
      if(!correct){ btns.forEach(x=>{ if(x.textContent===answerVal) x.classList.add('correct'); }); }
      if(correct) ST.score+=1;
      checkAllDone();
    });
    btns.push(b);
    row.appendChild(b);
  });
}

/* ============ INIT ============ */
render();
</script>
